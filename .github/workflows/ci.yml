name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Bash and Docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
          chmod +x check_api.sh analyze_logs.sh

      - name: Check public API
        run: |
          for attempt in 1 2 3; do
            if ./check_api.sh https://httpbin.org/status/200; then
              exit 0
            fi
            echo "Attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done
          exit 1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start containers
        run: docker compose up -d

      - name: Check proxy response
        run: |
          for attempt in $(seq 1 20); do
            response=$(curl --silent --fail --max-time 2 http://localhost:80) || response=""
            if [ "$response" = "Monitoring Service Active" ]; then
              ./check_api.sh http://localhost:80
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not return the expected response"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down
